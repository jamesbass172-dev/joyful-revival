name = "joy-for-the-children"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

main = "dist/server/server.js"

[assets]
directory = "dist/client"
binding = "ASSETS"

# Durable shared storage for the admin portal. For a new Cloudflare account:
#   1. wrangler d1 create joyco-admin
#   2. Replace the database_id below with the ID printed by that command.
#   3. wrangler d1 execute joyco-admin --file=migrations/0001_admin.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "joyco-admin"
database_id = "REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_ID"
