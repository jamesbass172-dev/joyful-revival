# wrangler.toml
name = "joyful-revival"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

main = "dist/server/server.js"

[assets]
directory = "dist/client"
binding = "ASSETS"

# Durable shared storage for the admin portal. For a new Cloudflare account:
#   1. wrangler d1 create joyco-admin
#   2. Replace the database_id below with the ID printed by that command.
#   3. wrangler d1 execute joyco-admin --file=migrations/0001_admin.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "joyco-admin"
database_id = "122b8b66-1978-41b1-ab43-6c4bc0d73c29"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

